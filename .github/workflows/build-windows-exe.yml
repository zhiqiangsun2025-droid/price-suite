name: 自动打包Windows EXE

on:
  push:
    branches: [ master, main ]
    paths:
      - 'client/**'
      - 'rpa/**'
      - '.github/workflows/build-windows-exe.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 安装依赖
      run: |
        cd client
        python -m pip install --upgrade pip
        pip install -r requirements_modern.txt
        pip install pyinstaller pyautogui pywinauto opencv-python
        
    - name: 构建可执行文件
      run: |
        cd client
        pyinstaller --onefile `
          --windowed `
          --name="智能选品系统-v${{ github.run_number }}" `
          --add-data="../rpa/rpa_controller.py;rpa" `
          --add-data="../rpa/templates;rpa/templates" `
          --hidden-import=customtkinter `
          --hidden-import=PIL `
          --hidden-import=pandas `
          --hidden-import=openpyxl `
          --hidden-import=pyautogui `
          --hidden-import=pywinauto `
          --hidden-import=cv2 `
          --hidden-import=requests `
          --hidden-import=cryptography `
          --clean `
          modern_client_ultimate.py
          
    - name: 查看构建结果
      run: |
        cd client/dist
        dir
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: 智能选品系统-Windows-Build${{ github.run_number }}
        path: client/dist/*.exe
        retention-days: 30
        
    - name: 创建 Release (仅标签推送)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: client/dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
